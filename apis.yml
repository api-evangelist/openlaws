- aid: openlaws:openlaws-laws-api
  name: OpenLaws Laws API
  description: >-
    Laws represent a specific law type in a Jurisdiction. For example, Code of Federal Regulations belongs
    to the FED Jurisdiction and is represented by the law_key `FED-CFR`. Florida Statutes belongs to the
    FL Jurisdiction and is represented by the law_key `FL-STAT`. Note that case law and case opinions
    are represented as Opinions that belong to Courts and Jurisdictions rather than Laws.
  humanURL: https://openlaws.us/api/
  baseURL: https://api.openlaws.us
